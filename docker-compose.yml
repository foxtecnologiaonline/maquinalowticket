version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maquinalowticket-postgres
    environment:
      POSTGRES_DB: maquinalowticket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./packages/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maquinalowticket-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: maquinalowticket-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/maquinalowticket
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-min-32-characters-long
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MARKETING_REPORT_EMAIL_FROM: ${MARKETING_REPORT_EMAIL_FROM:-}
      MARKETING_AGENT_ENABLED: ${MARKETING_AGENT_ENABLED:-false}
      MARKETING_AGENT_CRON: ${MARKETING_AGENT_CRON:-0 8 * * *}
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api/src:/app/apps/api/src

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: maquinalowticket-dashboard
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    volumes:
      - ./apps/dashboard:/app/apps/dashboard

volumes:
  postgres_data:
